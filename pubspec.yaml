name: tsukuyomi_space_app
description: Native Flutter Room client for Tsukuyomi Space.
publish_to: none
version: 0.4.0+4
environment:
  sdk: ^3.13.4
dependencies:
  flutter:
    sdk: flutter
  http: ^1.6.0
  flutter_secure_storage: ^10.0.0
  shared_preferences: ^2.5.3
  audioplayers: ^6.5.1
  tsukuyomi_live2d:
    path: packages/tsukuyomi_live2d
  cupertino_icons: ^1.0.9
  url_launcher: ^6.3.2
  flutter_widget_from_html_core: ^0.17.4
  flutter_markdown_plus: ^1.0.12
  html: ^0.15.7
  file_selector: ^1.1.0
  geolocator: ^14.1.1
  share_plus: ^13.3.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/live2d/
    - assets/live2d/textures/
