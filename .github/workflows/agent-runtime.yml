name: Desktop Agent runtimes
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'lib/core/agent/**'
      - 'lib/core/model_protocol.dart'
      - 'lib/core/model_runtime.dart'
      - 'lib/core/room_protocol.dart'
      - 'lib/core/llm_client.dart'
      - 'lib/core/room_tools.dart'
      - 'lib/features/agent/**'
      - 'tool/agent/**'
      - 'test/desktop_agent_test.dart'
      - 'test/deepseek_agent_runtime_test.dart'
      - 'test/agent_svg_test.dart'
      - 'test/model_agent_protocol_test.dart'
      - 'test/mcp_protocol_test.dart'
      - '.github/workflows/agent-runtime.yml'
permissions:
  contents: read
concurrency:
  group: agent-runtime-${{ github.ref }}
  cancel-in-progress: true
jobs:
  runtime:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: macos
          - os: windows-2022
            target: windows
          - os: ubuntu-22.04
            target: linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - run: python tool/release/prepare_assets.py
      - run: flutter pub get
      - run: python tool/agent/prepare_runtime.py --target '${{ matrix.target }}'
      - name: Exercise fixed runtime, permissions and recovery
        run: flutter test --no-pub --concurrency=1 test/desktop_agent_test.dart test/deepseek_agent_runtime_test.dart test/agent_svg_test.dart test/model_agent_protocol_test.dart test/mcp_protocol_test.dart --dart-define=RUN_AGENT_TESTS=true --dart-define=AGENT_BUNDLE_PATH=build/agent-runtime
