name: Flutter prototype
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: flutter-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: python3 tool/release/verify_android_toolchain.py
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test packages/tsukuyomi_live2d/lib packages/tsukuyomi_live2d/hook
      - run: flutter analyze
      - run: flutter test --concurrency=1
      - run: flutter build web
  native-shells:
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: macos
            command: flutter build macos --debug
          - os: windows-latest
            target: windows
            command: flutter build windows --debug
          - os: ubuntu-latest
            target: linux
            command: flutter build linux --debug
          - os: ubuntu-latest
            target: android
            command: flutter build apk --debug
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - if: matrix.target == 'linux'
        run: bash tool/release/setup_linux.sh
      - if: matrix.target == 'windows'
        uses: NuGet/setup-nuget@v2
      - if: matrix.target == 'macos'
        run: |
          if ! command -v pod >/dev/null; then brew install cocoapods; fi
          pod --version
      - if: matrix.target == 'android'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - if: matrix.target == 'android'
        run: bash tool/release/setup_android.sh
      - run: flutter pub get
      - run: ${{ matrix.command }}
