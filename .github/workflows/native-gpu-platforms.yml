name: Native GPU platforms
on:
  pull_request:
    paths:
      - 'packages/tsukuyomi_live2d/**'
      - 'packages/tsukuyomi_studio_motion/**'
      - 'third_party/yachiyo-live2d-studio/**'
      - 'assets/live2d/studio-motion.js'
      - 'test/studio_motion_test.dart'
      - 'tool/probe*gpu.dart'
      - 'tool/release/native_gpu_smoke.py'
      - '.github/workflows/native-gpu-platforms.yml'
  push:
    branches: ['codex/live2d-native-platforms']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-gpu-${{ github.ref }}
  cancel-in-progress: true
jobs:
  gpu:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: linux
          - os: windows-2022
            target: windows
          - os: macos-15
            target: ios
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - if: matrix.target == 'linux'
        run: |
          bash tool/release/setup_linux.sh
          sudo apt-get install -y xvfb mesa-utils scrot gdb
      - if: matrix.target == 'windows'
        uses: NuGet/setup-nuget@v2
      - run: python tool/release/prepare_assets.py
      - run: flutter pub get
      - if: matrix.target != 'ios'
        run: flutter test --concurrency=1 test/studio_motion_test.dart test/live2d_gpu_test.dart test/live2d_shader_build_test.dart
      - if: matrix.target == 'linux'
        name: OpenGL native texture probe (Mesa software rendering)
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          xvfb-run -a -s "-screen 0 1280x1024x24" dbus-run-session -- python tool/release/native_gpu_smoke.py linux
      - if: matrix.target == 'windows'
        name: D3D11 native texture probe (WARP software rendering)
        env:
          TSUKUYOMI_GPU_QA_WARP: '1'
        run: |
          python tool/release/native_gpu_smoke.py windows
      - if: matrix.target == 'ios'
        name: Compile iOS device Metal and Flutter texture bridge
        run: flutter build ios --release --no-codesign -t tool/probe_native_gpu.dart
      - uses: actions/upload-artifact@v4
        if: always() && matrix.target != 'ios'
        with:
          name: native-gpu-${{ matrix.target }}
          path: artifacts/native-gpu/
          if-no-files-found: warn
