name: Release installers
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Version tag to create after all checks pass; leave empty for build-only validation
        type: string
        required: false
      publish:
        description: Publish all verified installers to the specified release tag
        type: boolean
        default: false
      prerelease:
        description: Mark the release as a preview
        type: boolean
        default: true
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: false
env:
  FLUTTER_VERSION: '3.47.5'
jobs:
  metadata:
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.release.outputs.version }}
      build_number: ${{ steps.release.outputs.build_number }}
      tag: ${{ steps.release.outputs.tag }}
      ref: ${{ steps.release.outputs.ref }}
      publish: ${{ steps.release.outputs.publish }}
      prerelease: ${{ steps.release.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate version, tag and publication mode
        id: release
        env:
          INPUT_TAG: ${{ inputs.release_tag }}
          INPUT_PUBLISH: ${{ inputs.publish }}
          INPUT_PRERELEASE: ${{ inputs.prerelease }}
          GH_TOKEN: ${{ github.token }}
        run: |
          args=()
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            args+=(--tag "$GITHUB_REF_NAME" --publish)
            [[ "$GITHUB_REF_NAME" == *-* ]] || args+=(--stable)
          else
            args+=(--tag "$INPUT_TAG")
            [[ "$INPUT_PUBLISH" != true ]] || args+=(--publish)
            [[ "$INPUT_PRERELEASE" != false ]] || args+=(--stable)
          fi
          python tool/release/metadata.py "${args[@]}"
          tag="$INPUT_TAG"
          [[ "$GITHUB_REF" != refs/tags/* ]] || tag="$GITHUB_REF_NAME"
          if [[ "$GITHUB_REF" == refs/tags/* || "$INPUT_PUBLISH" == true ]]; then
            if draft=$(gh release view "$tag" --json isDraft --jq .isDraft 2>/dev/null); then
              [[ "$draft" == true ]] || { echo 'A published release cannot be replaced.'; exit 1; }
            fi
          fi
  quality:
    needs: metadata
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.metadata.outputs.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Validate Android toolchain against this Flutter SDK
        run: python tool/release/verify_android_toolchain.py
      - name: Download and verify licensed build inputs
        run: python tool/release/prepare_assets.py
      - run: python -m unittest discover -s tool/release -p 'test_*.py'
      - run: python -m unittest discover -s tool/agent -p 'test_*.py'
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test packages/tsukuyomi_live2d/lib packages/tsukuyomi_live2d/hook
      - run: flutter analyze --no-pub
      - name: Check out original site backend fixture
        uses: actions/checkout@v4
        with:
          repository: redchenk/tsukuyomi-space
          ref: 4b0ade76ac38dd0c0df551862b8b943a9cf96a15
          path: build/site-fixture-source
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: build/site-fixture-source/package-lock.json
      - run: npm ci --prefix build/site-fixture-source
      - name: Run all source and real backend regressions
        run: |
          node tool/testing/site_room_fixture.cjs build/site-fixture-source > /tmp/site-fixture.log 2>&1 &
          SITE_FIXTURE_PID=$!
          trap 'kill "$SITE_FIXTURE_PID"' EXIT
          for attempt in {1..30}; do
            curl --silent --output /dev/null http://127.0.0.1:4184/ && break
            sleep 1
          done
          RUN_SITE_FIXTURE=1 flutter test --no-pub --concurrency=1 --dart-define=RUN_CUBISM_TESTS=true --dart-define=RUN_WEBSITE_INTEGRATION=true
  build:
    needs: [metadata, quality]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: macos
          - os: macos-15
            target: ios
          - os: windows-2022
            target: windows
          - os: ubuntu-22.04
            target: linux
          - os: ubuntu-22.04
            target: android
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      APP_VERSION: ${{ needs.metadata.outputs.version }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.metadata.outputs.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Install Linux native build and playback libraries
        if: matrix.target == 'linux'
        run: bash tool/release/setup_linux.sh
      - name: Verify CocoaPods for native media and QQ login
        if: matrix.target == 'macos' || matrix.target == 'ios'
        run: |
          if ! command -v pod >/dev/null; then brew install cocoapods; fi
          pod --version
      - name: Install NuGet for Windows WebView2 plugin
        if: matrix.target == 'windows'
        uses: NuGet/setup-nuget@v2
      - if: matrix.target == 'android'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - if: matrix.target == 'android'
        run: bash tool/release/setup_android.sh
      - name: Download and verify licensed build inputs
        run: python tool/release/prepare_assets.py
      - run: flutter pub get
      - name: Prepare fixed desktop Agent runtimes
        if: matrix.target == 'macos' || matrix.target == 'windows' || matrix.target == 'linux'
        run: python tool/agent/prepare_runtime.py --target "${{ matrix.target }}"
      - name: Build macOS universal release
        if: matrix.target == 'macos'
        run: |
          flutter build macos --release
          APP=build/macos/Build/Products/Release/tsukuyomi_space_app.app
          python tool/agent/package_runtime.py --platform macos --bundle "$APP"
          ARCHS="$(lipo -archs "$APP/Contents/MacOS/tsukuyomi_space_app")"
          [[ "$ARCHS" == *arm64* && "$ARCHS" == *x86_64* ]]
          codesign --verify --deep --strict "$APP"
          python tool/release/verify_assets.py "$APP/Contents/Frameworks/App.framework/Resources/flutter_assets"
          mkdir -p dist build/dmg
          cp -R "$APP" 'build/dmg/Tsukuyomi Space.app'
          cp docs/release-guide.md THIRD_PARTY_NOTICES.md build/dmg/
          ln -s /Applications build/dmg/Applications
          hdiutil create -volname 'Tsukuyomi Space' -srcfolder build/dmg -ov -format UDZO "dist/tsukuyomi-space-$APP_VERSION-macos-universal.dmg"
          hdiutil verify "dist/tsukuyomi-space-$APP_VERSION-macos-universal.dmg"
      - name: Build unsigned iPhoneOS IPA for self-signing
        if: matrix.target == 'ios'
        run: |
          flutter build ios --release --no-codesign
          python tool/release/package_ios.py
          python tool/release/verify_assets.py "dist/tsukuyomi-space-$APP_VERSION-ios-arm64-unsigned.ipa"
      - name: Build Windows release
        if: matrix.target == 'windows'
        run: |
          flutter build windows --release
          python tool/agent/package_runtime.py --platform windows --bundle build/windows/x64/runner/Release
          python tool/release/verify_assets.py build/windows/x64/runner/Release/data/flutter_assets
      - name: Package Windows with Visual C++ runtime
        if: matrix.target == 'windows'
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $crt = Get-ChildItem "$vs\VC\Redist\MSVC\*\x64\Microsoft.VC143.CRT" -Directory | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $crt) { throw 'Visual C++ runtime not found' }
          Copy-Item "$($crt.FullName)\*.dll" build\windows\x64\runner\Release\
          # NuGet copies this loader beside the plugin target, but Flutter's
          # generated bundle lists only the plugin DLL itself.
          $loader = 'build\windows\x64\packages\Microsoft.Web.WebView2\build\native\x64\WebView2Loader.dll'
          if (-not (Test-Path $loader)) { throw 'WebView2 x64 loader is missing' }
          Copy-Item $loader build\windows\x64\runner\Release\
          $webview = 'build\windows\x64\runner\Release\MicrosoftEdgeWebview2Setup.exe'
          Invoke-WebRequest 'https://go.microsoft.com/fwlink/p/?LinkId=2124703' -OutFile $webview
          $signature = Get-AuthenticodeSignature $webview
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'O=Microsoft Corporation') {
            throw 'WebView2 bootstrapper must have a valid Microsoft signature'
          }
          Copy-Item THIRD_PARTY_NOTICES.md,docs\release-guide.md build\windows\x64\runner\Release\
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath "dist\tsukuyomi-space-$env:APP_VERSION-windows-x64.zip"
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$env:APP_VERSION" tool\release\windows.iss
          if ($LASTEXITCODE -ne 0) { throw 'Installer compilation failed' }
      - name: Build and package Linux
        if: matrix.target == 'linux'
        run: |
          flutter build linux --release
          python tool/agent/package_runtime.py --platform linux --bundle build/linux/x64/release/bundle
          python tool/release/verify_assets.py build/linux/x64/release/bundle/data/flutter_assets
          python tool/release/package_linux.py
          dpkg-deb --info "dist/tsukuyomi-space-$APP_VERSION-linux-x64.deb"
      - name: Build signed Android APKs
        if: matrix.target == 'android'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" && test -n "$ANDROID_KEYSTORE_PASSWORD"
          export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/tsukuyomi-release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
          chmod 600 "$ANDROID_KEYSTORE_PATH"
          trap 'rm -f "$ANDROID_KEYSTORE_PATH"' EXIT
          flutter build apk --release --split-per-abi --target-platform android-arm64,android-x64
          mkdir -p dist
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          for abi in arm64-v8a x86_64; do
            APK="build/app/outputs/flutter-apk/app-$abi-release.apk"
            "$APKSIGNER" verify --verbose "$APK"
            python tool/release/verify_assets.py "$APK"
            cp "$APK" "dist/tsukuyomi-space-$APP_VERSION-android-$abi.apk"
          done
          python tool/release/verify_apks.py dist/*.apk
      - name: Exercise packaged OpenCode, MCP gateway and Codex sandbox
        if: matrix.target == 'macos' || matrix.target == 'windows' || matrix.target == 'linux'
        run: |
          case "${{ matrix.target }}" in
            macos) RUNTIME=build/macos/Build/Products/Release/tsukuyomi_space_app.app/Contents/Resources/agent ;;
            windows) RUNTIME=build/windows/x64/runner/Release/agent ;;
            linux) RUNTIME=build/linux/x64/release/bundle/agent ;;
          esac
          flutter test --no-pub --concurrency=1 test/desktop_agent_test.dart test/deepseek_agent_runtime_test.dart test/agent_svg_test.dart test/model_agent_protocol_test.dart test/mcp_protocol_test.dart --dart-define=RUN_AGENT_TESTS=true --dart-define=AGENT_BUNDLE_PATH="$RUNTIME"
      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14
  native-smoke:
    needs: [metadata, quality]
    uses: ./.github/workflows/mobile-native.yml
    with:
      ref: ${{ needs.metadata.outputs.ref }}
    secrets: inherit
  publish:
    if: needs.metadata.outputs.publish == 'true'
    needs: [metadata, build, native-smoke]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.metadata.outputs.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: installers-*
          path: dist
          merge-multiple: true
      - name: Verify every download before publication
        run: |
          cp docs/release-guide.md dist/INSTALL.md
          cp THIRD_PARTY_NOTICES.md dist/
          python tool/release/verify_dist.py dist
          (cd dist && sha256sum --check SHA256SUMS.txt)
      - name: Upload complete release and publish
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PUBLISH_TOKEN || github.token }}
          RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
          PRERELEASE: ${{ needs.metadata.outputs.prerelease }}
          RELEASE_COMMIT: ${{ needs.metadata.outputs.ref }}
          APP_VERSION: ${{ needs.metadata.outputs.version }}
        run: bash tool/release/publish.sh
